name: Deploy MagniFIT PWA

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUB_KEY: ${{ secrets.VITE_SUPABASE_PUB_KEY || vars.VITE_SUPABASE_PUB_KEY }}

      - name: Generate 404.html
        run: |
          cat << 'EOF' > dist/404.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <title>Redirecting...</title>
              <script type="text/javascript">
                // Segment configuration: 1 for project pages (user.github.io/repo), 0 for user/org pages
                var pathSegmentsToKeep = 1;

                var l = window.location;
                var route = l.pathname.split('/').slice(pathSegmentsToKeep + 1).join('/');
                var search = l.search ? '&' + l.search.slice(1) : '';
                var hash = l.hash;

                l.replace(
                  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                  l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') +
                  '/?p=/' + route + (search ? '?' + search.slice(1) : '') + hash
                );
              </script>
            </head>
            <body></body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
